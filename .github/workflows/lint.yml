name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint and Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: ESLint
        run: pnpm exec eslint .

      - name: Prettier
        run: pnpm exec prettier --check .
