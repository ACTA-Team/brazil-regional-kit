name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. A dependency that was clean on merge day can be vulnerable by
    # Friday, and nobody reopens a green PR to find out.
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Fails on anything NOT already reviewed into security/audit-baseline.json.
      # Every advisory in that file has a written reason and went through review;
      # see the header comment in scripts/audit.ts for why a plain
      # `pnpm audit --audit-level=high` would be red on day one and therefore
      # ignored by everyone.
      - name: Nothing new at high or above
        run: pnpm audit:check

      # Informational: the full list, including everything on the baseline, so a
      # reviewer can see the whole picture without running anything locally.
      - name: Full report
        if: always()
        run: pnpm audit || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          # Gitleaks scans history, not just the tip. A key that was committed
          # and then "removed" in a later commit is still a leaked key.
          fetch-depth: 0

      # The gitleaks BINARY is MIT and free for anyone. It is the marketplace
      # action wrapper (`gitleaks/gitleaks-action@v2`) that requires a paid
      # licence once the repository belongs to an organisation — which this one
      # does, so that action fails with "missing gitleaks license" and scans
      # nothing. Running the binary directly is the same scanner, no licence,
      # no secret to configure.
      #
      # Pinned rather than `latest` so a new release cannot change what CI
      # enforces without a visible commit.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `git` scans history, not just the tip — a key committed and then
      # "removed" in a later commit is still a leaked key. `--redact` keeps the
      # secret itself out of the public build log; the file and commit are
      # reported, which is what you need to act on it.
      - name: Scan history for secrets
        run: gitleaks git --redact --verbose --no-banner --config .gitleaks.toml .

  env-hygiene:
    name: No real secrets committed
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      # .env.example is documentation and belongs in the repo. A real .env does
      # not, and .gitignore only helps if nobody ever used `git add -f`.
      - name: Only .env.example is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "These environment files are committed and should not be:"
            echo "$tracked"
            exit 1
          fi
          echo "Only .env.example is tracked."

      # The API key must never reach the browser. Next inlines anything prefixed
      # NEXT_PUBLIC_ into the client bundle, so that prefix on a secret is a leak
      # by construction rather than by accident.
      - name: No secret is exposed to the browser
        run: |
          leaked=$(grep -rIn --include='*.ts' --include='*.tsx' \
            -E 'NEXT_PUBLIC_[A-Z_]*(KEY|SECRET|TOKEN|PASSWORD|PRIVATE)' \
            apps packages scripts || true)
          if [ -n "$leaked" ]; then
            echo "A secret-looking value is prefixed NEXT_PUBLIC_, which ships it to the browser:"
            echo "$leaked"
            exit 1
          fi
          echo "No NEXT_PUBLIC_ secret found."
