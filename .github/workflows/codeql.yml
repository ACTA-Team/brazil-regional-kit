name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory is caught even on a quiet repo.
    - cron: '31 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Code scanning needs GitHub Advanced Security, which private repositories
    # only get as a paid add-on. Without it the upload step fails with
    # "Advanced Security must be enabled for this repository" — a billing fact,
    # not a finding, and a red X that says nothing about the code is worse than
    # no X at all.
    #
    # Skipping rather than deleting is the point: the analysis is free the
    # moment this repository is public, and it starts running again on its own
    # with no one having to remember to re-add it.
    if: github.event.repository.visibility == 'public'

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` adds the checks that matter for code handling
          # payments and signatures — injection, unsafe deserialization, weak
          # randomness — over the default set.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
