name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite is hermetic — no anchor, no Horizon, no credentials. A test that
  # fails because a third party is down is worse than no test.
  RAMP_MODE: mock

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Unit tests
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
