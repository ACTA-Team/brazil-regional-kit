name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite is hermetic — no anchor, no Horizon, no credentials. A test that
  # fails because a third party is down is worse than no test.
  RAMP_MODE: mock

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # One run, not two. `test:coverage` runs the same suite and additionally
      # enforces the thresholds in vitest.config.ts, so it fails both on a
      # broken test and on coverage sliding backwards.
      - name: Tests and coverage thresholds
        run: pnpm test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
